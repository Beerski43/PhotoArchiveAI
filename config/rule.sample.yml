# 抽出ルールのサンプル。config/rule.yml に写して使う。
# 日付は引用符の有無どちらでも読める。end はその日の終わりまで含む。
date:
  start: 2000-01-01
  end: 2025-12-31
family_only: true
count_per_year: 30
include_video: true
remove_duplicate: true
# 同じ場面の連写・似た写真と、同じ年の中の写し（別のフォルダ・送られてきた写真）を、並びの先頭1枚にまとめる（省略すると true）。
remove_similar: true
# 自動割り当ての顔も家族として数える（false なら GUI の手本だけ。省略すると true）。
include_auto_assigned: true
# 同じ行事（フォルダ×日）の中で似た写真を束ねる。日付をまたぐ連写をつなぐ撮影の間隔（秒）と、
# 見た目の近さ（0〜64・小さいほど厳しい）。省略すると下の値。
# similar_seconds: 10
# similar_distance: 16
# 撮影時刻の離れた2枚の見た目の近さと、同じ年の写し（別のフォルダ・送られてきた写真）とみなす近さ。
# similar_far_distance: 14
# copy_distance: 9
# 並びの重み（書いていない項目は既定値）。
# weights:
#   sharpness: 0.35
#   frontal: 0.25
#   eyes: 0.20
#   smile: 0.20
#   member_bonus: 20
#   stranger_penalty: 30
#   technical: 0.3     # 写真の画質（ぶれ・ピンぼけ・暗さ。photoarchive assess で測る）
#   aesthetic: 0.1     # 写真の美しさ（構図）
#   highlights: 0      # 白飛びの減点
#   shadows: 0         # 黒つぶれの減点
#   cutoff: 0          # 家族の顔が写真の縁で切れているときの減点
# 年ごとの枚数は年ごとにも書ける（書いていない年からは選ばない）。
# count_per_year:
#   2018: 50
#   2019: 30
#   unknown: 10   # 撮影した年の分からない写真
#   2027+: 30     # 2027 年以降（年が変わったら GUI で設定し直す）
