# 抽出ルールのサンプル。config/rule.yml に写して使う。
# 撮影時期で絞るなら書く（書かなければ絞らない。GUI の写真の選定タブでも変えられる）。
# 日付は引用符の有無どちらでも読める。end はその日の終わりまで含む。
# date:
#   start: 2000-01-01
#   end: 2025-12-31
family_only: true
count_per_year: 30
include_video: true
remove_duplicate: true
# 同じ場面の連写・似た写真と、同じ年の中の写し（別のフォルダ・送られてきた写真）を、並びの先頭1枚にまとめる（省略すると true）。
remove_similar: true
# 自動割り当ての顔も家族として数える（false なら GUI の手本だけ。省略すると true）。
include_auto_assigned: true
# 同じ行事（フォルダ×日）の中で似た写真を束ねる。日付をまたぐ連写をつなぐ撮影の間隔（秒）と、
# 見た目の近さ（0〜64・小さいほど厳しい）。省略すると下の値。
# similar_seconds: 10
# similar_distance: 16
# 撮影時刻の離れた2枚の見た目の近さと、同じ年の写し（別のフォルダ・送られてきた写真）とみなす近さ。
# similar_far_distance: 14
# copy_distance: 9
# 並びの重み（書いていない項目は既定値）。
# 点 = (家族の加点 − Σ 他人(減点)の顔の点 × strangers) × face_ratio / 100
#      + 写真全体の点 × (100 − face_ratio) / 100。顔の6項目・写真全体の4項目は、それぞれの中での比（#139）
# weights:
#   face_ratio: 70     # 比重（0〜100）。顔の側の割合。残りが写真全体
#   extra_person: 0.5  # 2人目以降の効き（0〜1）。家族の加点は高い順に、2人目に 0.5、3人目に 0.25 … をかけて足す
#   sharpness: 0.3     # 顔: ボケていない
#   frontal: 0.2       # 顔: 正面を向いている
#   eyes: 0.15         # 顔: 目を開けている
#   smile: 0.15        # 顔: 笑っている
#   size: 0.15         # 顔: 大きく写っている（その写真でいちばん大きい顔と比べる）
#   cutoff: 0.05       # 顔: 写真の縁で切れていない
#   strangers: 1.0     # 他人(減点)の顔（GUI で顔認証外にした顔のうち印を付けた顔）の点にかける重み
#   technical: 0.3     # 写真全体: 画質（ぶれ・ピンぼけ・暗さ。MUSIQ の値。photoarchive assess で測る）
#   aesthetic: 0.1     # 写真全体: 美しさ（構図。NIMA の値）。画質とは別の重みで両方が点に入る。どちらに寄せるかは2つの比
#   highlights: 0      # 写真全体: 白飛びしていない
#   shadows: 0         # 写真全体: 黒つぶれしていない
# 出力の形。year は出力先の中に年ごとのフォルダ（既定）、flat は出力先の直下に平らに。
# output_layout: year
# 年ごとの枚数は年ごとにも書ける（書いていない年からは選ばない）。
# count_per_year:
#   2018: 50
#   2019: 30
#   unknown: 10   # 撮影した年の分からない写真
#   2027+: 30     # 2027 年以降で、上に書いていない年（これから増える年のため）
