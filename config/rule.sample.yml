# 抽出ルールのサンプル。config/rule.yml に写して使う。
# 日付は引用符の有無どちらでも読める。end はその日の終わりまで含む。
date:
  start: 2000-01-01
  end: 2025-12-31
family_only: true
count_per_year: 30
include_video: true
remove_duplicate: true
# 同じ場面の連写・似た写真を、並びの先頭1枚にまとめる（省略すると true）。
remove_similar: true
# 連写とみなす撮影の間隔（秒）と、見た目の近さ（0〜64・小さいほど厳しい）。省略すると下の値。
# similar_seconds: 10
# similar_distance: 16
