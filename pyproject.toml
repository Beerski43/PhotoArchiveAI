[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoarchive-ai"
version = "0.1.0"
description = "Family photo and video archive selection tool with local analysis, SQLite persistence, CLI and PySide6 GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
    "pillow-heif>=0.18",
    "dlib>=19.24",
    # モデルデータ(.dat)のためだけに入れる。パッケージ自体は import しない
    # (pkg_resources に依存しており新しい setuptools では読み込めないため)。
    "face_recognition_models @ git+https://github.com/ageitgey/face_recognition_models",
    "mediapipe==0.10.21",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "PyYAML>=6.0"
]

[project.scripts]
photoarchive = "photoarchive_ai.cli:main"
photoarchive-gui = "photoarchive_ai.gui:main"

[tool.setuptools]
packages = ["photoarchive_ai"]
package-dir = {"" = "src"}

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
# tests/helpers.py を `from tests.helpers import ...` で読むため、
# リポジトリルートを sys.path に入れる。これが無いと素の `pytest` は
# 収集時に ModuleNotFoundError: No module named 'tests' で落ちる。
pythonpath = ["."]
# 未登録のマーカーを警告ではなく失敗にする(タイポで実行対象から漏れるのを防ぐ)。
addopts = ["--strict-markers"]
markers = [
    "system: end-to-end system tests",
    "models: requires the real dlib face models",
]
